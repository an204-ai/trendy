# Rate limit zone: 10MB memory, tối đa 30 requests/giây trên mỗi IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Connection limit zone: tối đa 30 kết nối đồng thời trên mỗi IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Bảo vệ chống DoS kết nối
  limit_conn conn_limit 30;

  # Gzip nén dữ liệu tăng tốc độ tải trang và điểm SEO
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Chống DoS cho toàn bộ các API endpoint
  location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    limit_req_status 429;

    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts chống Slowloris DoS
    proxy_connect_timeout 10s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
  }

  # File robots.txt và sitemap.xml phục vụ tìm kiếm Google / Cốc Cốc
  location = /robots.txt {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
    log_not_found off;
  }

  location = /sitemap.xml {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
    log_not_found off;
  }

  # Static assets caching (ảnh, font, script, css)
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
